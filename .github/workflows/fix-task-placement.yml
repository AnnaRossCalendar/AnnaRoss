name: Fix task placement

on:
  push:
    paths:
      - '.github/workflows/fix-task-placement.yml'

permissions:
  contents: write

jobs:
  fix-task-placement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Center task badge inside calendar day
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          old = '''.badge{
            position:absolute;left:7px;right:7px;bottom:7px;
            background:rgba(248,251,255,.94);
            border:1px solid rgba(109,143,198,.35);
            border-left:3px solid #6d8fc6;
            border-radius:8px;padding:4px 6px;
            font-family:"Bradley Hand","Segoe Print","Comic Sans MS",cursive;
            color:#456694;font-size:clamp(9px,1.1vw,16px);
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
          }
          '''

          new = '''.badge{
            position:absolute;
            left:8px;
            right:8px;
            top:56%;
            transform:translateY(-50%);
            background:rgba(248,251,255,.96);
            border:1px solid rgba(109,143,198,.45);
            border-radius:8px;
            padding:5px 7px;
            font-family:"Bradley Hand","Segoe Print","Comic Sans MS",cursive;
            color:#456694;
            font-size:clamp(9px,1.1vw,16px);
            line-height:1.15;
            text-align:center;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
            box-sizing:border-box;
          }
          '''

          if old not in text:
              raise SystemExit('Expected task badge CSS was not found; no changes made.')

          p.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Commit task placement fix
        run: |
          git config user.name "Anna Ross Calendar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Fix calendar task placement"
          git push origin main
