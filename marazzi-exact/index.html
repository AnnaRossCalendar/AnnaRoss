<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=4,user-scalable=yes"><meta name="apple-mobile-web-app-capable" content="yes"><title>Marazzi Merchandising Form</title><style>html,body{margin:0;background:#e9edf2;font-family:Arial,sans-serif}.topbar{position:sticky;top:0;z-index:99;background:#fff;border-bottom:1px solid #aaa;padding:8px;display:flex;gap:8px}.topbar input{flex:1;font-size:17px;padding:10px;border:1px solid #aaa;border-radius:8px}.topbar button{border:0;border-radius:8px;padding:10px 12px;font-weight:700;font-size:15px}.new{background:#f3e3e3;color:#8a2020}.shot{background:#213f70;color:#fff}iframe{display:block;border:0;width:100%;height:1800px;background:#fff;transform-origin:top left}.screen .topbar{display:none}.back{display:none;position:fixed;right:12px;bottom:12px;z-index:100;background:#213f70;color:white;border:0;border-radius:999px;padding:12px 16px;font-weight:700}.screen .back{display:block}</style></head><body><div class="topbar"><input id="find" placeholder="Find board or part #"><button class="new" onclick="fresh()">New Account</button><button class="shot" onclick="screen()">Screenshot View</button></div><iframe id="f" src="../marazzi-official/"></iframe><button class="back" onclick="edit()">Back to Edit</button><script>const f=document.getElementById('f');f.onload=()=>{const d=f.contentDocument;const s=d.createElement('style');s.textContent=`body{background:#fff!important;font-family:Arial,Helvetica,sans-serif!important}.app{max-width:1360px!important;padding-bottom:20px!important}.toolbar,.actions{display:none!important}.form{padding:8px 14px!important;position:relative}.form:after{content:'MARAZZI\\A DARE TO BE BOLD™';white-space:pre;position:absolute;top:0;right:13%;text-align:center;color:#213f70;font-weight:900;font-size:42px;line-height:1.05;letter-spacing:4px}.title{font-size:25px!important;margin:0 0 2px!important}.yellow{font-size:12px!important;padding:2px 3px!important;margin:0 0 5px!important}.cust{width:42%!important;grid-template-columns:145px 1fr!important;border:1px solid #555!important;border-bottom:0!important}.cust label,.cust input,.cust textarea{min-height:28px!important;height:28px!important;font-size:12px!important;padding:4px 5px!important;border-bottom:1px solid #555!important}.cust label{border-right:1px solid #555!important;background:#fff!important;font-weight:700!important}.cust input,.cust textarea{background:#fff!important;border-left:0!important;border-right:0!important;border-top:0!important;border-radius:0!important;outline:none!important}.cols{grid-template-columns:1fr 1.18fr!important;gap:90px!important;margin-top:7px!important}.head,.r{grid-template-columns:145px 1fr 52px 48px!important;font-size:11px!important}.head div,.r>div{padding:2px 4px!important;min-height:20px!important;height:20px!important;line-height:1.05!important}.head{background:#777!important}.sec{background:#213f70!important;font-size:13px!important;padding:2px 4px!important;height:20px!important}.r.new{background:#fff200!important}.r.sel,.r.sel.new{background:inherit!important;outline:2px solid rgba(45,108,223,.7);outline-offset:-2px}.qb{width:19px!important;height:18px!important;border-radius:2px!important;font-size:13px!important}.qn{font-size:11px!important}.shotmode .r:not(.sel){display:none!important}.shotmode .sec.empty-section{display:none!important}.shotmode .qb{display:none!important}.shotmode .r.sel{outline:none!important;display:grid!important}.shotmode .cust input,.shotmode .cust textarea{background:#fff!important}.shotmode .foot{display:none!important}.shotmode .cols{align-items:start!important}.shotmode .form{padding-bottom:2px!important}@media(max-width:820px){.form{min-width:1180px!important}.cols{grid-template-columns:1fr 1.18fr!important;gap:90px!important}.cust{width:42%!important}.head,.r{grid-template-columns:145px 1fr 52px 48px!important}}`;d.head.appendChild(s);setTimeout(()=>f.style.height=Math.max(1500,d.documentElement.scrollHeight+20)+'px',200)};function fresh(){const d=f.contentDocument;if(d&&d.defaultView.fresh)d.defaultView.fresh();else f.src=f.src}function markSections(d){d.querySelectorAll('.sec').forEach(sec=>{let n=sec.nextElementSibling,has=false;while(n&&!n.classList.contains('sec')){if(n.classList&&n.classList.contains('r')&&n.classList.contains('sel')){has=true;break}if(n.querySelector&&n.querySelector('.r.sel')){has=true;break}n=n.nextElementSibling}sec.classList.toggle('empty-section',!has)})}function fitShot(){const d=f.contentDocument;if(!d)return;markSections(d);requestAnimationFrame(()=>{const app=d.querySelector('.app')||d.documentElement;const h=app.scrollHeight,w=app.scrollWidth;const scale=Math.min(1,(window.innerHeight-4)/h,window.innerWidth/w);f.style.transform='scale('+scale+')';f.style.width=(100/scale)+'%';f.style.height=(h*scale)+'px'})}function screen(){const d=f.contentDocument;if(!d)return;d.body.classList.add('shotmode');document.body.classList.add('screen');scrollTo(0,0);setTimeout(fitShot,120)}function edit(){const d=f.contentDocument;if(d){d.body.classList.remove('shotmode');d.querySelectorAll('.empty-section').forEach(x=>x.classList.remove('empty-section'))}f.style.transform='none';f.style.width='100%';f.style.height=d?Math.max(1500,d.documentElement.scrollHeight+20)+'px':'1800px';document.body.classList.remove('screen')}document.getElementById('find').addEventListener('input',function(){const d=f.contentDocument;if(!d)return;const s=d.getElementById('search');if(s){s.value=this.value;s.dispatchEvent(new Event('input',{bubbles:true}))}});</script></body></html>
