<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=4,user-scalable=yes"><meta name="apple-mobile-web-app-capable" content="yes"><title>Marazzi Merchandising Form</title><style>*{box-sizing:border-box}html,body{margin:0;background:#e9edf2;font-family:Arial,sans-serif}.topbar{position:sticky;top:0;z-index:99;background:#fff;border-bottom:1px solid #aaa;padding:8px;display:flex;gap:8px}.topbar input{flex:1;font-size:17px;padding:10px;border:1px solid #aaa;border-radius:8px}.topbar button{border:0;border-radius:8px;padding:10px 12px;font-weight:700;font-size:15px}.new{background:#f3e3e3;color:#8a2020}.shot{background:#213f70;color:#fff}iframe{display:block;border:0;width:100%;height:1800px;background:#fff}.back{display:none;position:fixed;right:12px;bottom:12px;z-index:120;background:#213f70;color:white;border:0;border-radius:999px;padding:12px 16px;font-weight:700}.screen .topbar,.screen iframe{display:none}.screen .back{display:block}.shotpage{display:none;background:#fff;width:100%;min-height:100vh;padding:14px 18px}.screen .shotpage{display:block}.sp-head{display:grid;grid-template-columns:42% 58%;align-items:start}.sp-title{font-size:30px;font-weight:800;line-height:1.05}.sp-yellow{display:inline-block;background:#fff200;font-weight:900;font-size:14px;padding:2px 4px;margin:5px 0 7px}.sp-logo{text-align:center;color:#213f70;font-weight:900;font-size:52px;letter-spacing:6px;line-height:1.05}.sp-cust{width:100%;border:1px solid #555;border-bottom:0}.sp-crow{display:grid;grid-template-columns:180px 1fr;min-height:34px;border-bottom:1px solid #555}.sp-crow b,.sp-crow span{padding:6px 8px;font-size:14px}.sp-crow b{border-right:1px solid #555}.sp-cols{display:grid;grid-template-columns:1fr 1fr;gap:42px;margin-top:9px}.sp-table{width:100%}.sp-th,.sp-row{display:grid;grid-template-columns:31% 51% 10% 8%;border-left:1px solid #666;border-right:1px solid #666;border-bottom:1px solid #666}.sp-th{background:#7c7d80;color:#fff;font-weight:800;border-top:1px solid #666}.sp-th div,.sp-row div{padding:4px 6px;border-right:1px solid #777;font-size:12px;min-height:24px}.sp-th div:last-child,.sp-row div:last-child{border-right:0}.sp-sec{background:#213f70;color:white;font-size:16px;font-weight:900;padding:4px 6px;border:1px solid #666;border-top:0}.sp-new{background:#fff200}.sp-part{font-weight:700}.sp-num{text-align:center}.sp-empty{font-size:14px;padding:10px;border:1px solid #aaa}.sp-note{font-size:11px;margin-top:7px;color:#444}@media(max-width:900px){.sp-title{font-size:25px}.sp-logo{font-size:42px}.sp-cols{gap:24px}.sp-crow{grid-template-columns:155px 1fr}.sp-th div,.sp-row div{font-size:11px;padding:3px 4px;min-height:22px}.sp-sec{font-size:14px}.shotpage{padding:10px 12px}}</style></head><body><div class="topbar"><input id="find" placeholder="Find board or part #"><button class="new" onclick="fresh()">New Account</button><button class="shot" onclick="screen()">Screenshot View</button></div><iframe id="f" src="../marazzi-official/?v=20260822e"></iframe><div id="shotpage" class="shotpage"></div><button class="back" onclick="edit()">Back to Edit</button><script>const f=document.getElementById('f'),shotpage=document.getElementById('shotpage');f.onload=()=>{const d=f.contentDocument;const s=d.createElement('style');s.textContent=`body{background:#fff!important;font-family:Arial,Helvetica,sans-serif!important}.app{max-width:1360px!important;padding-bottom:20px!important}.toolbar,.actions{display:none!important}.form{padding:8px 14px!important;position:relative}.form:after{content:'MARAZZI\\A DARE TO BE BOLD™';white-space:pre;position:absolute;top:0;right:13%;text-align:center;color:#213f70;font-weight:900;font-size:42px;line-height:1.05;letter-spacing:4px}.title{font-size:25px!important;margin:0 0 2px!important}.yellow{font-size:12px!important;padding:2px 3px!important;margin:0 0 5px!important}.cust{width:42%!important;grid-template-columns:145px 1fr!important;border:1px solid #555!important;border-bottom:0!important}.cust label,.cust input,.cust textarea{min-height:28px!important;height:28px!important;font-size:12px!important;padding:4px 5px!important;border-bottom:1px solid #555!important}.cust label{border-right:1px solid #555!important;background:#fff!important;font-weight:700!important}.cust input,.cust textarea{background:#fff!important;border-left:0!important;border-right:0!important;border-top:0!important;border-radius:0!important;outline:none!important}.cols{grid-template-columns:1fr 1.18fr!important;gap:90px!important;margin-top:7px!important}.head,.r{grid-template-columns:145px 1fr 52px 48px!important;font-size:11px!important}.head div,.r>div{padding:2px 4px!important;min-height:20px!important;height:20px!important;line-height:1.05!important}.head{background:#777!important}.sec{background:#213f70!important;font-size:13px!important;padding:2px 4px!important;height:20px!important}.r.new{background:#fff200!important}.r.sel,.r.sel.new{background:inherit!important;outline:2px solid rgba(45,108,223,.7);outline-offset:-2px}.qb{width:19px!important;height:18px!important;border-radius:2px!important;font-size:13px!important}.qn{font-size:11px!important}@media(max-width:820px){.form{min-width:1180px!important}.cols{grid-template-columns:1fr 1.18fr!important;gap:90px!important}.cust{width:42%!important}.head,.r{grid-template-columns:145px 1fr 52px 48px!important}}`;d.head.appendChild(s);setTimeout(()=>f.style.height=Math.max(1500,d.documentElement.scrollHeight+20)+'px',200)};function fresh(){const d=f.contentDocument;if(d&&d.defaultView.fresh)d.defaultView.fresh();else f.src=f.src;edit()}function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function getQty(r){const q=r.querySelector('.qn');return q?q.textContent.trim():''}function rowData(r){const divs=Array.from(r.children);return{part:(divs[0]?.textContent||'').trim(),desc:(divs[1]?.textContent||'').trim(),list:(divs[2]?.textContent||'').trim(),qty:getQty(r),isNew:r.classList.contains('new')}}function collectColumn(col){const groups=[];let current=null;Array.from(col.children).forEach(el=>{if(el.classList?.contains('sec')){current={name:el.textContent.trim(),rows:[]};groups.push(current);return}if(el.classList?.contains('r')){const rd=rowData(el);if(rd.qty&&Number(rd.qty)>0){if(!current){current={name:'',rows:[]};groups.push(current)}current.rows.push(rd)}return}if(el.querySelectorAll){Array.from(el.querySelectorAll(':scope > .r')).forEach(r=>{const rd=rowData(r);if(rd.qty&&Number(rd.qty)>0){if(!current){current={name:'',rows:[]};groups.push(current)}current.rows.push(rd)}})}});return groups.filter(g=>g.rows.length)}function groupHtml(groups){if(!groups.length)return'';let h='<div class="sp-th"><div>PART #</div><div>DESCRIPTION</div><div>LIST</div><div>QTY</div></div>';groups.forEach(g=>{if(g.name)h+='<div class="sp-sec">'+esc(g.name)+'</div>';g.rows.forEach(r=>{h+='<div class="sp-row '+(r.isNew?'sp-new':'')+'"><div class="sp-part">'+esc(r.part)+'</div><div>'+esc(r.desc)+'</div><div class="sp-num">'+esc(r.list)+'</div><div class="sp-num"><b>'+esc(r.qty)+'</b></div></div>'})});return h}function screen(){const d=f.contentDocument;if(!d)return;const customer=d.getElementById('customer')?.value||'',account=d.getElementById('account')?.value||'',address=d.getElementById('address')?.value||'';const cols=d.querySelectorAll('.cols > div');const left=cols[0]?collectColumn(cols[0]):[],right=cols[1]?collectColumn(cols[1]):[];shotpage.innerHTML='<div class="sp-head"><div><div class="sp-title">Merchandising Support Materials</div><div class="sp-yellow">NEW STYLES HIGHLIGHTED IN YELLOW</div><div class="sp-cust"><div class="sp-crow"><b>CUSTOMER NAME:</b><span>'+esc(customer)+'</span></div><div class="sp-crow"><b>Account #</b><span>'+esc(account)+'</span></div><div class="sp-crow"><b>Ship To Address</b><span>'+esc(address)+'</span></div></div></div><div class="sp-logo">MARAZZI<br>DARE TO BE BOLD™</div></div><div class="sp-cols"><div class="sp-table">'+groupHtml(left)+'</div><div class="sp-table">'+groupHtml(right)+'</div></div>';document.body.classList.add('screen');scrollTo(0,0)}function edit(){document.body.classList.remove('screen');shotpage.innerHTML='';scrollTo(0,0)}document.getElementById('find').addEventListener('input',function(){const d=f.contentDocument;if(!d)return;const s=d.getElementById('search');if(s){s.value=this.value;s.dispatchEvent(new Event('input',{bubbles:true}))}});</script></body></html>
