<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=4,user-scalable=yes"><meta name="apple-mobile-web-app-capable" content="yes"><title>Marazzi Merchandising Form</title><style>*{box-sizing:border-box}html,body{margin:0;background:#e9edf2;font-family:Arial,sans-serif}.topbar{position:sticky;top:0;z-index:99;background:#fff;border-bottom:1px solid #aaa;padding:8px;display:flex;gap:8px}.topbar input{flex:1;font-size:17px;padding:10px;border:1px solid #aaa;border-radius:8px}.topbar button{border:0;border-radius:8px;padding:10px 12px;font-weight:700;font-size:15px}.new{background:#f3e3e3;color:#8a2020}.shot{background:#213f70;color:#fff}iframe{display:block;border:0;width:100%;height:1800px;background:#fff;transform-origin:top left}.back{display:none;position:fixed;right:12px;bottom:12px;z-index:120;background:#213f70;color:white;border:0;border-radius:999px;padding:12px 16px;font-weight:700}.screen .topbar{display:none}.screen .back{display:block}</style></head><body><div class="topbar"><input id="find" placeholder="Find board or part #"><button class="new" onclick="fresh()">New Account</button><button class="shot" onclick="screen()">Screenshot View</button></div><iframe id="f" src="../marazzi-official/?v=20260822h"></iframe><button class="back" onclick="edit()">Back to Edit</button><script>const f=document.getElementById('f');f.onload=()=>{const d=f.contentDocument;const s=d.createElement('style');s.textContent=`body{background:#fff!important;font-family:Arial,Helvetica,sans-serif!important}.app{max-width:1360px!important;padding-bottom:20px!important}.toolbar,.actions{display:none!important}.form{padding:8px 14px!important;position:relative}.form:after{content:'MARAZZI\\A DARE TO BE BOLD™';white-space:pre;position:absolute;top:0;right:13%;text-align:center;color:#213f70;font-weight:900;font-size:42px;line-height:1.05;letter-spacing:4px}.title{font-size:25px!important;margin:0 0 2px!important}.yellow{font-size:12px!important;padding:2px 3px!important;margin:0 0 5px!important}.cust{width:42%!important;grid-template-columns:145px 1fr!important;border:1px solid #555!important;border-bottom:0!important}.cust label,.cust input,.cust textarea{min-height:28px!important;height:28px!important;font-size:12px!important;padding:4px 5px!important;border-bottom:1px solid #555!important}.cust label{border-right:1px solid #555!important;background:#fff!important;font-weight:700!important}.cust input,.cust textarea{background:#fff!important;border-left:0!important;border-right:0!important;border-top:0!important;border-radius:0!important;outline:none!important}.cols{grid-template-columns:1fr 1.18fr!important;gap:90px!important;margin-top:7px!important}.head,.r{grid-template-columns:145px 1fr 52px 48px!important;font-size:11px!important}.head div,.r>div{padding:2px 4px!important;min-height:20px!important;height:20px!important;line-height:1.05!important}.head{background:#777!important}.sec{background:#213f70!important;font-size:13px!important;padding:2px 4px!important;height:20px!important}.r.new{background:#fff200!important}.r.sel,.r.sel.new{background:inherit!important;outline:2px solid rgba(45,108,223,.7);outline-offset:-2px}.qb{width:19px!important;height:18px!important;border-radius:2px!important;font-size:13px!important}.qn{font-size:11px!important}.fullshot .qb{display:none!important}.fullshot .r{display:grid!important}.fullshot .sec{display:block!important}.fullshot .head{display:grid!important}.fullshot .r.sel,.fullshot .r.sel.new{outline:none!important}.fullshot .toolbar,.fullshot .actions{display:none!important}.fullshot .app{min-height:0!important;height:auto!important;padding-bottom:0!important}.fullshot .form{padding-bottom:4px!important}@media(max-width:820px){.form{min-width:1180px!important}.cols{grid-template-columns:1fr 1.18fr!important;gap:90px!important}.cust{width:42%!important}.head,.r{grid-template-columns:145px 1fr 52px 48px!important}}`;d.head.appendChild(s);setTimeout(()=>f.style.height=Math.max(1500,d.documentElement.scrollHeight+20)+'px',200)};function fresh(){const d=f.contentDocument;if(d&&d.defaultView.fresh)d.defaultView.fresh();else f.src=f.src;edit()}function fitFullPage(){const d=f.contentDocument;if(!d)return;d.body.classList.remove('order','shotmode');d.body.classList.add('fullshot');d.querySelectorAll('.r').forEach(r=>r.style.setProperty('display','grid','important'));d.querySelectorAll('.sec').forEach(s=>s.style.setProperty('display','block','important'));d.querySelectorAll('.head').forEach(h=>h.style.setProperty('display','grid','important'));const form=d.querySelector('.form');if(!form)return;f.style.transform='none';f.style.marginLeft='0';f.style.width='1180px';f.style.height='auto';requestAnimationFrame(()=>{const fullH=Math.ceil(form.scrollHeight)+12;const fullW=1180;const availW=window.innerWidth-12;const availH=window.innerHeight-12;const scale=Math.min(availW/fullW,availH/fullH);f.style.height=fullH+'px';f.style.transform='scale('+scale+')';f.style.transformOrigin='top left';f.style.marginLeft=Math.max(0,(window.innerWidth-fullW*scale)/2)+'px';document.body.style.height=(fullH*scale)+'px';scrollTo(0,0)})}function screen(){const d=f.contentDocument;if(!d)return;document.body.classList.add('screen');setTimeout(fitFullPage,80)}function edit(){const d=f.contentDocument;if(d){d.body.classList.remove('fullshot','order','shotmode');d.querySelectorAll('.r,.sec,.head').forEach(el=>el.style.removeProperty('display'))}document.body.classList.remove('screen');document.body.style.height='';f.style.transform='none';f.style.width='100%';f.style.marginLeft='0';f.style.height=d?Math.max(1500,d.documentElement.scrollHeight+20)+'px':'1800px';scrollTo(0,0)}document.getElementById('find').addEventListener('input',function(){const d=f.contentDocument;if(!d)return;const s=d.getElementById('search');if(s){s.value=this.value;s.dispatchEvent(new Event('input',{bubbles:true}))}});</script></body></html>
