<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anna Ross's Calendar</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef2f7;font-family:Arial,sans-serif;color:#35567c}
.wrap{max-width:1180px;margin:auto;padding:10px}
.stage{position:relative;width:100%;aspect-ratio:1.18/1;border-radius:28px;overflow:hidden;box-shadow:0 14px 32px rgba(44,63,91,.18)}
.stage img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.hotspot{position:absolute;background:transparent;border:0;cursor:pointer;z-index:4}
.monthTab{left:17.8%;top:1.8%;width:11.7%;height:5.8%}
.todayTab{left:30.4%;top:1.8%;width:11.7%;height:5.8%}
.weekTab{left:43%;top:1.8%;width:10.7%;height:5.8%}
.dumpTab{left:54.6%;top:1.8%;width:14.1%;height:5.8%}
.inspoTab{left:69.3%;top:1.8%;width:13.2%;height:5.8%}
.mtab{right:.3%;width:6.5%;height:5.7%}
.aug{top:12.3%}.sep{top:18%}.oct{top:23.8%}.nov{top:29.5%}.dec{top:35.3%}
.jan{top:41%}.feb{top:46.8%}.mar{top:52.5%}.apr{top:58.3%}.may{top:64%}.jun{top:69.8%}.jul{top:75.5%}
.grid{position:absolute;left:4.7%;top:31.1%;width:84.4%;height:60.4%;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,1fr);z-index:3}
.cell{position:relative;border:0;background:transparent;cursor:pointer}
.cell:hover{background:rgba(244,216,140,.13)}
.badge{position:absolute;left:6px;right:6px;bottom:5px;background:rgba(238,245,252,.94);border-left:3px solid #6d8fc6;border-radius:7px;padding:3px 5px;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.overlay{position:absolute;inset:0;background:rgba(248,251,255,.86);backdrop-filter:blur(2px);z-index:10;display:none;align-items:center;justify-content:center;padding:20px}
.overlay.show{display:flex}
.card{width:min(590px,94%);background:#fffdf9;border:1px solid #c8d8e9;border-radius:22px;padding:20px;box-shadow:0 14px 34px rgba(54,76,105,.18)}
.card h2,.panel h1,.panel h2{font-family:"Bradley Hand","Segoe Print","Comic Sans MS",cursive;color:#5e80b8;font-weight:500}
.card h2{font-size:31px;margin:0 0 12px}
input,textarea,select{width:100%;padding:11px;border:1px solid #c8d8e9;border-radius:11px;margin-top:8px;font:inherit}
textarea{min-height:130px;resize:vertical}
.row{display:flex;gap:8px;margin-top:12px}.row>*{flex:1}
.btn{border:0;border-radius:11px;padding:10px 14px;background:#5e80b8;color:white;font-weight:700;cursor:pointer}
.btn.alt{background:#f2db99;color:#5f5a4e}
.item{display:flex;gap:8px;align-items:flex-start;padding:9px 0;border-bottom:1px dotted #c8d8e9}
.item span{flex:1}.item input{width:auto;margin-top:4px}.item button{border:0;background:none;color:#999;font-size:18px}
.done{text-decoration:line-through;opacity:.5}
.panel{position:absolute;left:7%;right:8.5%;top:8.5%;bottom:5.5%;z-index:8;background:rgba(255,253,249,.97);border-radius:28px;display:none;padding:22px;overflow:auto}
.panel.show{display:block}
.panel h1{text-align:center;font-size:42px;margin:0 0 18px}
.grid2{display:grid;grid-template-columns:1.2fr .8fr;gap:15px}
.box{background:white;border:1px solid #c8d8e9;border-radius:17px;padding:15px}
.box h2{margin:0 0 10px;font-size:26px}
.weekgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.weekday{background:white;border:1px solid #c8d8e9;border-radius:13px;padding:10px;min-height:145px}
.weekday h3{font-family:"Bradley Hand","Segoe Print",cursive;color:#5e80b8;margin:0 0 8px}
@media(max-width:800px){
  .stage{height:790px;aspect-ratio:auto}
  .bg{object-fit:cover}
  .panel{left:3%;right:3%;top:7%;bottom:3%}
  .grid2,.weekgrid{grid-template-columns:1fr}
}
</style>
</head>

    <button class="hotspot monthTab" data-view="month"></button>
    <button class="hotspot todayTab" data-view="today"></button>
    <button class="hotspot weekTab" data-view="week"></button>
    <button class="hotspot dumpTab" data-view="dump"></button>
    <button class="hotspot inspoTab" data-view="inspiration"></button>

    <button class="hotspot mtab aug" data-month="7"></button>
    <button class="hotspot mtab sep" data-month="8"></button>
    <button class="hotspot mtab oct" data-month="9"></button>
    <button class="hotspot mtab nov" data-month="10"></button>
    <button class="hotspot mtab dec" data-month="11"></button>
    <button class="hotspot mtab jan" data-month="0"></button>
    <button class="hotspot mtab feb" data-month="1"></button>
    <button class="hotspot mtab mar" data-month="2"></button>
    <button class="hotspot mtab apr" data-month="3"></button>
    <button class="hotspot mtab may" data-month="4"></button>
    <button class="hotspot mtab jun" data-month="5"></button>
    <button class="hotspot mtab jul" data-month="6"></button>

    <div class="grid" id="grid"></div>

    <div class="overlay" id="overlay">
      <div class="card">
        <h2 id="dateTitle">Add to this day</h2>
        <input id="eventText" placeholder="What do you need to remember?">
        <select id="eventType"><option>Task</option><option>Appointment</option><option>Reminder</option></select>
        <div class="row">
          <button class="btn" id="saveEvent">Save</button>
          <button class="btn alt" id="closeOverlay">Cancel</button>
        </div>
        <div id="dateItems"></div>
      </div>
    </div>

    <div class="panel" id="todayPanel">
      <h1>Today</h1>
      <div class="grid2">
        <div class="box">
          <h2>Top 3</h2>
          <input class="top" data-i="0" placeholder="1. Biggest priority">
          <input class="top" data-i="1" placeholder="2. Second priority">
          <input class="top" data-i="2" placeholder="3. Third priority">
          <h2 style="margin-top:16px">To-Do List</h2>
          <div class="row"><input id="taskText" placeholder="Add a task"><button class="btn alt" id="addTask">Add</button></div>
          <div id="taskList"></div>
        </div>
        <div class="box">
          <h2>Notes</h2>
          <textarea id="notes" placeholder="Anything you need to remember..."></textarea>
          <h2 style="margin-top:16px">On This Date</h2>
          <div id="dayEvents"></div>
        </div>
      </div>
      <div class="row"><button class="btn alt closePanel">Back to Month</button></div>
    </div>

    <div class="panel" id="weekPanel">
      <h1>This Week</h1>
      <div class="weekgrid" id="weekGrid"></div>
      <div class="row"><button class="btn alt closePanel">Back to Month</button></div>
    </div>

    <div class="panel" id="dumpPanel">
      <h1>Brain Dump</h1>
      <div class="box">
        <textarea id="dumpText" placeholder="Dump it here. One thing per line or separate with semicolons."></textarea>
        <input id="dumpDate" type="date">
        <select id="dumpType"><option>Task</option><option>Appointment</option><option>Reminder</option></select>
        <div class="row"><button class="btn" id="dumpSave">Put It On My Calendar</button><button class="btn alt closePanel">Back</button></div>
      </div>
    </div>

    <div class="panel" id="inspirationPanel">
      <h1>Inspiration</h1>
      <div class="box">
        <h2>August Focus</h2>
        <div class="item"><span>$401,000 sales goal</span></div>
        <div class="item"><span>5 face-to-face visits a day</span></div>
        <div class="item"><span>Sell LVP daily</span></div>
        <textarea id="inspoNotes" placeholder="Quotes, wins, ideas, things you love..."></textarea>
        <div class="row"><button class="btn alt closePanel">Back to Month</button></div>
      </div>
    </div>
  </div>
</div>
<script>
const KEY='annaRossExactVibe1';
let S={selected:'2026-08-13',events:{},days:{},inspo:''};
try{S={...S,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const pretty=k=>new Date(k+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
const rec=()=>S.days[S.selected]||(S.days[S.selected]={top:['','',''],tasks:[],notes:''});

function buildGrid(){
  grid.innerHTML='';
  const first=6, days=31;
  for(let i=0;i<42;i++){
    const b=document.createElement('button');b.className='cell';b.type='button';
    const d=i-first+1;
    if(d>=1&&d<=days){
      const k='2026-08-'+String(d).padStart(2,'0');
      (S.events[k]||[]).slice(0,2).forEach(e=>{
        const s=document.createElement('div');s.className='badge';s.textContent=e.text;b.appendChild(s)
      });
      b.onclick=()=>openDate(k);
    }
    grid.appendChild(b)
  }
}
function openDate(k){
  S.selected=k;save();dateTitle.textContent=pretty(k);overlay.classList.add('show');renderDateItems()
}
function renderDateItems(){
  dateItems.innerHTML='';
  (S.events[S.selected]||[]).forEach((e,i)=>{
    const row=document.createElement('div');row.className='item';
    const sp=document.createElement('span');sp.textContent=e.text;
    const del=document.createElement('button');del.textContent='×';
    del.onclick=()=>{S.events[S.selected].splice(i,1);save();renderDateItems();buildGrid()};
    row.append(sp,del);dateItems.appendChild(row)
  })
}
saveEvent.onclick=()=>{
  const t=eventText.value.trim();if(!t)return;
  (S.events[S.selected]??=[]).push({text:t,type:eventType.value});
  eventText.value='';save();renderDateItems();buildGrid()
};
closeOverlay.onclick=()=>overlay.classList.remove('show');

document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('show'));
  if(b.dataset.view==='month')return;
  if(b.dataset.view==='today'){todayPanel.classList.add('show');renderToday()}
  if(b.dataset.view==='week'){weekPanel.classList.add('show');renderWeek()}
  if(b.dataset.view==='dump')dumpPanel.classList.add('show');
  if(b.dataset.view==='inspiration')inspirationPanel.classList.add('show');
});
document.querySelectorAll('.closePanel').forEach(b=>b.onclick=()=>document.querySelectorAll('.panel').forEach(p=>p.classList.remove('show')));

document.querySelectorAll('[data-month]').forEach(b=>b.onclick=()=>{
  alert('August is the locked visual prototype. Next we’ll create separate September, October, etc. backgrounds in this exact style.');
});

function renderToday(){
  const r=rec();
  document.querySelectorAll('.top').forEach((x,i)=>x.value=r.top[i]||'');
  notes.value=r.notes||'';
  taskList.innerHTML='';
  r.tasks.forEach((t,i)=>{
    const row=document.createElement('div');row.className='item';
    const cb=document.createElement('input');cb.type='checkbox';cb.checked=t.done;
    const sp=document.createElement('span');sp.textContent=t.text;if(t.done)sp.className='done';
    const del=document.createElement('button');del.textContent='×';
    cb.onchange=()=>{t.done=cb.checked;save();renderToday()};
    del.onclick=()=>{r.tasks.splice(i,1);save();renderToday()};
    row.append(cb,sp,del);taskList.appendChild(row)
  });
  dayEvents.innerHTML=(S.events[S.selected]||[]).map(e=>`<div class="item"><span>${e.text}</span><small>${e.type}</small></div>`).join('')||'<div class="item"><span>Nothing scheduled yet.</span></div>'
}
document.querySelectorAll('.top').forEach((x,i)=>x.oninput=e=>{rec().top[i]=e.target.value;save()});
notes.oninput=e=>{rec().notes=e.target.value;save()};
addTask.onclick=()=>{const t=taskText.value.trim();if(!t)return;rec().tasks.push({text:t,done:false});taskText.value='';save();renderToday()};

function renderWeek(){
  weekGrid.innerHTML='';
  const base=new Date(S.selected+'T12:00:00'),st=new Date(base);st.setDate(base.getDate()-base.getDay());
  for(let i=0;i<7;i++){
    const d=new Date(st);d.setDate(st.getDate()+i);
    const k=d.toISOString().slice(0,10);
    const box=document.createElement('div');box.className='weekday';
    box.innerHTML=`<h3>${d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}</h3>`;
    (S.events[k]||[]).forEach(e=>box.insertAdjacentHTML('beforeend',`<div class="item"><span>${e.text}</span></div>`));
    weekGrid.appendChild(box)
  }
}
dumpSave.onclick=()=>{
  const t=dumpText.value.trim(),d=dumpDate.value;if(!t||!d)return;
  (S.events[d]??=[]);
  t.split(/\n|;/).map(x=>x.trim()).filter(Boolean).forEach(x=>S.events[d].push({text:x,type:dumpType.value}));
  dumpText.value='';save();buildGrid()
};
inspoNotes.value=S.inspo||'';
inspoNotes.oninput=e=>{S.inspo=e.target.value;save()};
buildGrid();
</script>
</body>
