<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Anna Ross's Calendar</title>
<style>
html,body{margin:0;height:100%;background:#eef2f7}
iframe{display:block;width:100%;height:100vh;border:0;background:#fff}
</style>
</head>
<body>
<iframe id="cal" src="legacy.html" title="Anna Ross's Calendar"></iframe>
<script>
const f=document.getElementById('cal');
f.addEventListener('load',()=>{
  try{
    const d=f.contentDocument;
    const w=f.contentWindow;
    const g=d.querySelector('.grid');
    if(g){
      g.style.left='7.71%';
      g.style.top='33.45%';
      g.style.width='79.64%';
      g.style.height='54.75%';
    }

    const polishBadges=()=>d.querySelectorAll('.badge').forEach(b=>{
      b.style.left='50%';
      b.style.right='auto';
      b.style.transform='translateX(-50%)';
      b.style.bottom='10px';
      b.style.maxWidth='calc(100% - 14px)';
    });
    polishBadges();

    const style=d.createElement('style');
    style.textContent=`
      .monthViewTitle{
        position:absolute;left:7.71%;top:13.2%;width:79.64%;height:11.5%;z-index:5;
        display:none;align-items:center;justify-content:center;background:rgba(255,255,255,.96);
        border-radius:16px;font-family:"Bradley Hand","Segoe Print","Comic Sans MS",cursive;
        color:#5e80b8;font-size:clamp(26px,3.8vw,54px);font-weight:500;letter-spacing:.02em;
      }
      .monthViewGrid{
        position:absolute;left:7.71%;top:33.45%;width:79.64%;height:54.75%;z-index:4;
        display:none;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,1fr);
        background:rgba(255,255,255,.96);border-left:1px solid rgba(109,143,198,.28);
        border-top:1px solid rgba(109,143,198,.28);
      }
      .monthViewCell{
        position:relative;border:0;border-right:1px solid rgba(109,143,198,.28);
        border-bottom:1px solid rgba(109,143,198,.28);background:rgba(255,255,255,.92);
        cursor:pointer;padding:6px;color:#456694;text-align:left;font:inherit;
      }
      .monthViewCell:active{background:rgba(109,143,198,.08)}
      .monthViewCell.blank{cursor:default;background:rgba(248,251,255,.86)}
      .monthViewDay{
        position:absolute;top:5px;left:7px;font-family:"Bradley Hand","Segoe Print","Comic Sans MS",cursive;
        color:#5e80b8;font-size:clamp(11px,1.45vw,20px);
      }
      .monthViewBadge{
        position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);width:calc(100% - 14px);
        background:rgba(248,251,255,.97);border:1px solid rgba(109,143,198,.45);border-radius:8px;
        padding:5px 7px;color:#456694;font-family:"Bradley Hand","Segoe Print","Comic Sans MS",cursive;
        font-size:clamp(9px,1.1vw,16px);line-height:1.15;text-align:center;white-space:nowrap;
        overflow:hidden;text-overflow:ellipsis;box-sizing:border-box;
      }
      @media(max-width:800px){
        .monthViewTitle{left:7.71%;width:79.64%}
      }
    `;
    d.head.appendChild(style);

    const stage=d.getElementById('stage');
    const title=d.createElement('div');
    title.className='monthViewTitle';
    title.textContent='September 2026';
    stage.appendChild(title);

    const sepGrid=d.createElement('div');
    sepGrid.className='monthViewGrid';
    sepGrid.setAttribute('aria-label','September 2026 calendar');
    stage.appendChild(sepGrid);

    let mode='august';
    const readState=()=>{
      try{return JSON.parse(w.localStorage.getItem('annaRossPlanner_v1')||'{"events":{}}')}catch(e){return {events:{}}}
    };

    function renderSeptember(){
      mode='september';
      d.querySelectorAll('.panel').forEach(p=>p.classList.remove('show'));
      if(g)g.style.visibility='hidden';
      title.style.display='flex';
      sepGrid.style.display='grid';
      sepGrid.innerHTML='';

      const first=2; // Tuesday, September 1, 2026 on a Sunday-first calendar.
      const days=30;
      const S=readState();
      for(let i=0;i<42;i++){
        const cell=d.createElement('button');
        cell.type='button';
        cell.className='monthViewCell';
        const day=i-first+1;
        if(day<1||day>days){
          cell.classList.add('blank');
          cell.disabled=true;
        }else{
          const key='2026-09-'+String(day).padStart(2,'0');
          const n=d.createElement('span');
          n.className='monthViewDay';
          n.textContent=day;
          cell.appendChild(n);
          const evs=(S.events&&S.events[key])||[];
          if(evs.length){
            const badge=d.createElement('div');
            badge.className='monthViewBadge';
            badge.textContent=evs[0].text+(evs.length>1?' +'+(evs.length-1):'');
            cell.appendChild(badge);
          }
          cell.setAttribute('aria-label','September '+day+', 2026');
          cell.onclick=()=>w.openDate(key);
        }
        sepGrid.appendChild(cell);
      }
    }

    function showAugust(){
      mode='august';
      title.style.display='none';
      sepGrid.style.display='none';
      if(g)g.style.visibility='visible';
      if(typeof w.buildGrid==='function')w.buildGrid();
      setTimeout(polishBadges,0);
      d.querySelectorAll('.panel').forEach(p=>p.classList.remove('show'));
    }

    const aug=d.querySelector('[data-month="7"]');
    const sep=d.querySelector('[data-month="8"]');
    if(aug)aug.onclick=showAugust;
    if(sep)sep.onclick=renderSeptember;

    const refreshSeptember=()=>setTimeout(()=>{if(mode==='september')renderSeptember();},0);
    const saveEvent=d.getElementById('saveEvent');
    const overlay=d.getElementById('overlay');
    if(saveEvent)saveEvent.addEventListener('click',refreshSeptember);
    if(overlay)overlay.addEventListener('click',refreshSeptember);
  }catch(e){console.error(e)}
});
</script>
</body>
</html>
