<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Anna Ross's Calendar</title><style>html,body{margin:0;height:100%;background:#eef2f7}iframe{display:block;width:100%;height:100vh;border:0;background:#fff}</style></head><body><iframe id="cal" src="legacy.html" title="Anna Ross's Calendar"></iframe><script>const f=document.getElementById('cal');f.addEventListener('load',()=>{try{const d=f.contentDocument;const g=d.querySelector('.grid');if(g){g.style.left='7.35%';g.style.top='37.4%';g.style.width='76.5%';g.style.height='54.8%'}const badges=d.querySelectorAll('.badge');badges.forEach(b=>{b.style.left='50%';b.style.transform='translateX(-50%)';b.style.bottom='10px';b.style.maxWidth='calc(100% - 14px)'})}catch(e){console.error(e)}});</script></body></html>
